<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receiver Sign In — BloodConnect</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .standalone-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .standalone-card { width: min(100%, 460px); padding: 32px; background: #fff; border: 1px solid var(--border-card); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); }
    .standalone-brand { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 28px; color: var(--text-main); text-decoration: none; font-size: 1.2rem; font-weight: 800; }
    .standalone-brand span { color: var(--primary); }
    .standalone-icon { display: grid; place-items: center; width: 46px; height: 46px; margin-bottom: 18px; border-radius: 14px; background: var(--primary-light); color: var(--primary); font-size: 1.35rem; }
    .standalone-card h1 { margin-bottom: 6px; font-size: 1.7rem; letter-spacing: -0.03em; }
    .standalone-copy { margin-bottom: 24px; color: var(--text-muted); font-size: 0.9rem; }
    .standalone-card .btn-hero-primary { width: 100%; justify-content: center; margin-top: 8px; }
    .standalone-note { margin-top: 16px; padding: 12px; border-radius: 10px; background: var(--primary-light); color: var(--text-muted); font-size: 0.78rem; }
    .standalone-links { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; font-size: 0.83rem; }
    .standalone-links a { color: var(--primary); font-weight: 700; text-decoration: none; }
    @media (max-width: 480px) { .standalone-card { padding: 24px 20px; } }
  </style>
</head>
<body>
  <main class="standalone-page">
    <section class="standalone-card">
      <a class="standalone-brand" href="index.html">Blood<span>Connect</span></a>
      <div class="standalone-icon" aria-hidden="true">♥</div>
      <h1>Receiver sign in</h1>
      <p class="standalone-copy">Sign in to submit and track blood requests.</p>
      <form id="receiverLoginForm">
        <div class="form-group">
          <label class="form-label" for="receiverName">Your name</label>
          <input class="form-input" id="receiverName" type="text" autocomplete="name" placeholder="Full name" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="receiverEmail">Email or mobile</label>
          <input class="form-input" id="receiverEmail" type="text" autocomplete="username" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="receiverPassword">Password</label>
          <input class="form-input" id="receiverPassword" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn-hero-primary" type="submit">Sign in as receiver</button>
      </form>
      <p class="standalone-note">Demo sign-in: this prototype does not yet verify passwords.</p>
      <div class="standalone-links">
        <a href="index.html">Back to home</a>
        <a href="hospital-login.html">Hospital sign in</a>
      </div>
    </section>
  </main>
  <script>
    document.getElementById('receiverLoginForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const name = document.getElementById('receiverName').value.trim();
      const email = document.getElementById('receiverEmail').value.trim();
      localStorage.setItem('bc_user', JSON.stringify({ name, role: 'Receiver', email }));
      window.location.href = 'receiver-dashboard.html';
    });
  </script>
</body>
</html>
